server.port=9090
spring.application.name=PatchlyDemo
spring.datasource.url=jdbc:sqlserver://admin-patchly.database.windows.net:1433;database=patchlydb;encrypt=true;trustServerCertificate=false;loginTimeout=30;
spring.datasource.username=admin-patchly
spring.datasource.password=Password@12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always